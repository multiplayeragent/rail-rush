<script type="module">
/* ═══ RAIL RUSH · a Multiplayer Agent starter ════════════════════════════════════════
 * The train never stops: chop, mine, craft track and lay it ahead of it. Co-op, 1–4 players; bots help.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ train speed, heat, crafting, carrying, the map size, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   LAND .......... the seeded voxel map: grass, trees, rocks, water, cliffs, the station
 *   TRAIN & TRACK . where the track goes, where the train is (from timestamps), heat
 *   GAME (HOST) ... legs, crafting, what hit/water/deposit/cool/take/lay do. Host only.
 *   BOTS (HOST) ... lumberjack, miner and builder bots. Host only.
 *   SCENE ......... the 3D land, track, train, crew, particles
 *   ME ............ walking, the USE button and what it does where you stand
 *   HUD & RESULTS . heat bar, supplies, banners, results and the leaderboard
 *   INPUT ......... keyboard, touch stick, USE button
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The HOST is the lowest sessionId among live players (heartbeat `hb` seen in the
 *     last 3s), worked out every frame. The host's browser runs the train and the land.
 *   - The host writes: `game` (ONE JSON field: id, v, phase, the track as a string of
 *     moves, train speed + start time, heat + when it was cooled, the crafter's wood, stone
 *     and finished track; `v` goes up on every write), `land` (the map, one letter per tile:
 *     trees and rocks vanish as they are cut), `hands` (what each person and bot carries)
 *     and `bots`. The train's position is worked out from timestamps, so it is never sent.
 *   - Each player writes its OWN entity: `p` (position, facing, swinging ~12/s), `n`/`c`
 *     (name, color) and `hb` once a second.
 *   - Intents to the host: "hit" {x, z} (a tree or rock), "water" {x, z}, "deposit",
 *     "cool", "take", "lay" {x, z} and "again". The host checks you are close enough and
 *     updates `land`, `hands` and `game`. Its own actions apply directly.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "rail-tiles": how far the train got before it stopped.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  mapW: 36, mapD: 11,     // the map: tiles along the line × across it
  stationX: 31,           // the station starts this far along
  startTrack: 9,          // track already laid at the start of a leg
  speed: 0.3,             // train speed, tiles/s (leg 1)...
  speedUp: 0.05,          // ...plus this much each leg
  heatSecs: 45,           // seconds from cool to boiling over (bring water!)
  craftMs: 1100,          // the crafter turns 1 wood + 1 stone into 1 track in this time
  stashMax: 6,            // finished track the wagon holds
  startStash: 3,          // finished track at the start of a leg
  carry: 3,               // most wood, stone or track one person carries
  hits: { T: 2, R: 3 },   // hits to chop a tree / mine a rock
  hitGapMs: 260,          // ms between hits while you hold USE
  reach: 1.5,             // tiles: how far you can reach
  walk: 3.8,              // walking speed, tiles/s
  readyMs: 4000,          // the countdown before the train sets off
  stationMs: 4500,        // the "station reached" banner
  resultsMs: 14000,       // the results show this long, then a new run
  seats: 4,               // bots fill the crew up to this many
  botPace: 0.8,           // bots walk at this share of your speed
  board: "rail-tiles",    // leaderboard name
};
const BOT_NAMES = ["Axel", "Rocky", "Sparks", "Cole", "Ivy", "Rusty"];
const ROLES = ["lumber", "miner", "builder"]; // what each new bot prefers to do, in order
const COLORS = ["#ff5a5a", "#4da6ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];
const KIND_OF = { T: "wood", R: "stone" };

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'rail-rush',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const QS = new URLSearchParams(location.search), ATTRACT = QS.has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
let net = null, S = { entities: { players: {} }, shared: {} };
const memo = new Map();
/** A shared JSON field, parsed once per change (read-only: never mutate what this returns). */
function shared(key, fallback, map = (v) => v) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = map(parse(raw, fallback));
  memo.set(key, { raw, v });
  return v;
}
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);
const humans = () => livePlayers().filter((id) => !(ATTRACT && id === net.sessionId));

// ── LAND ────────────────────────────────────────────────────────────────────────────
// One letter per tile, row by row (z), each row mapW long:
//   . grass   T tree (wood)   R rock (stone)   W water   M cliff (can't be cut)   S station
const MW = CONFIG.mapW, MD = CONFIG.mapD;
const idx = (x, z) => z * MW + x;
const inMap = (x, z) => x >= 0 && z >= 0 && x < MW && z < MD;
const tileOf = (land, x, z) => (inMap(x, z) ? land[idx(x, z)] : "M");
const solidCh = (ch) => ch === "T" || ch === "R" || ch === "W" || ch === "M";
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = (x, z) => { let h = (x * 374761393 + z * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
/** A new leg's map from a seed: clumps of trees and rocks, a pond or two, cliffs along the edges. */
function makeLand(seed) {
  const r = mulberry32(seed), g = Array.from({ length: MD }, () => new Array(MW).fill("."));
  const zs = Math.floor(MD / 2), sx = CONFIG.stationX, zc = 2 + Math.floor(r() * (MD - 4));
  const blob = (ch, cx, cz, rad) => { for (let z = 1; z < MD - 1; z++) for (let x = 0; x < MW; x++) if (Math.hypot(x - cx, z - cz) < rad + r() * 0.6 && g[z][x] === ".") g[z][x] = ch; };
  for (let n = 0; n < 18; n++) blob(n % 2 ? "R" : "T", 4 + r() * (sx - 5), 1 + r() * (MD - 2), 0.7 + r() * 1.3);
  for (let n = 0; n < 2; n++) blob("W", 10 + r() * (sx - 16), 2.5 + r() * (MD - 5), 0.9 + r() * 0.8);
  for (let x = 0; x < MW; x++) { g[0][x] = g[MD - 1][x] = "M"; if (x > 6 && x < sx - 2) { if (r() < 0.3) g[1][x] = "M"; if (r() < 0.3) g[MD - 2][x] = "M"; } }
  for (let x = 0; x < CONFIG.startTrack + 1; x++) g[zs][x] = "."; // the starting line is clear
  for (let z = 1; z < MD - 1; z++) for (let x = sx - 1; x < MW; x++) g[z][x] = x >= sx && x < sx + 3 && Math.abs(z - zc) <= 1 ? "S" : x >= sx + 3 && r() < 0.5 ? "T" : ".";
  for (const [x, z] of [[2, zs - 2], [3, zs - 2], [3, zs + 2], [5, zs + 2], [6, zs - 3]]) if (z > 0 && z < MD - 1) g[z][x] = x % 2 ? "T" : "R"; // a little to start with near the train
  return { land: g.map((row) => row.join("")).join(""), zs };
}

// ── TRAIN & TRACK ───────────────────────────────────────────────────────────────────
// The track is a start tile plus one letter per piece: E, W (along x), N, S (along z).
const STEP = { E: [1, 0], W: [-1, 0], S: [0, 1], N: [0, -1] };
const trackCache = { key: "", tiles: [], set: new Set() };
function trackTiles(g) {
  const key = g.zs + ":" + g.track;
  if (trackCache.key !== key) {
    const tiles = [[0, g.zs]];
    for (const ch of g.track) { const [x, z] = tiles[tiles.length - 1], d = STEP[ch]; if (d) tiles.push([x + d[0], z + d[1]]); }
    Object.assign(trackCache, { key, tiles, set: new Set(tiles.map(([x, z]) => idx(x, z))) });
  }
  return trackCache;
}
const trackEnd = (g) => { const t = trackTiles(g).tiles; return t[t.length - 1]; };
/** Tiles where the next piece can go: next to the end, on grass or station, not already track. */
function layable(g, land) {
  const [ex, ez] = trackEnd(g), set = trackTiles(g).set, out = [];
  for (const [ch, [dx, dz]] of Object.entries(STEP)) { const x = ex + dx, z = ez + dz, t = tileOf(land, x, z); if ((t === "." || t === "S") && !set.has(idx(x, z))) out.push({ x, z, ch }); }
  return out;
}
/** How far along the track the engine is (tiles), from the start time: never sent, just computed. */
function trainDist(g, t = Date.now()) { return g.phase === "run" ? g.d0 + g.speed * Math.max(0, t - g.t0) / 1000 : g.d0; }
/** A point `d` tiles along the track: { x, z, a (heading) }. Past the end it keeps going straight (a derail). */
function alongTrack(g, d) {
  const tiles = trackTiles(g).tiles, n = tiles.length;
  const i = Math.max(0, Math.min(n - 2, Math.floor(d))), f = d - i;
  const [ax, az] = tiles[i], [bx, bz] = tiles[Math.min(n - 1, i + 1)];
  const dx = bx - ax, dz = bz - az;
  return { x: ax + 0.5 + dx * f, z: az + 0.5 + dz * f, a: Math.atan2(dz, dx) };
}
const WAGON_GAP = 1.15;
const wagonAt = (g, k, t) => alongTrack(g, Math.max(0, trainDist(g, t) - k * WAGON_GAP)); // 0 engine, 1 crafter, 2 track wagon
function heatOf(g, t = Date.now()) { return g.phase === "run" ? Math.min(100, g.heat0 + (100 / CONFIG.heatSecs) * Math.max(0, t - g.heatAt) / 1000) : g.heat0; }

// ── GAME (HOST) ─────────────────────────────────────────────────────────────────────
const host = { g: null, land: "", hands: {}, hp: new Map(), bots: new Map(), wasHost: false, dirtyG: false, dirtyL: false, dirtyH: false, lastG: 0, lastL: 0, lastH: 0, lastB: 0, path: null };
const hosting = () => isHost() && host.wasHost && host.g; // wasHost: adopted (not leftovers from an earlier turn as host)
const game = () => (hosting() ? host.g : shared("game", null));
const land = () => (hosting() ? host.land : typeof S.shared.land === "string" ? S.shared.land : "");
const hands = () => (hosting() ? host.hands : shared("hands", {}));
const handOf = (id) => { const h = hands()[id]; return Array.isArray(h) ? { k: h[0], n: h[1] } : { k: "", n: 0 }; };
const botList = () => (hosting() ? [...host.bots.values()].map((b) => ({ i: b.id, n: b.n, c: b.c, x: b.x, z: b.z, f: b.f, a: b.a ? 1 : 0, r: b.role })) : shared("bots", []));

/** A new leg (the next station), or a new run from leg 1. */
function newLeg(leg, done) {
  const old = host.g, t = Date.now(), seed = ATTRACT ? 4242 + leg : (Math.random() * 1e9) | 0, m = makeLand(seed); // the preview always gets the same map
  host.g = { id: (old?.id || 0) + 1, v: old?.v || 0, phase: "ready", leg, seed, zs: m.zs, track: "E".repeat(CONFIG.startTrack - 1), startAt: t + CONFIG.readyMs, endsAt: 0,
    speed: CONFIG.speed + (leg - 1) * CONFIG.speedUp, d0: 2.4, t0: t + CONFIG.readyMs, heat0: 0, heatAt: t + CONFIG.readyMs,
    wood: 0, stone: 0, stash: CONFIG.startStash, craftAt: 0, done, why: "" };
  host.land = m.land; host.hands = {}; host.hp.clear();
  for (const b of host.bots.values()) Object.assign(b, spawnSpot(b.slot), { task: null });

}
/** Become host: take over the run exactly as state has it. */
function adopt() {
  host.g = parse(S.shared.game, null);
  host.land = typeof S.shared.land === "string" ? S.shared.land : "";
  host.hands = { ...parse(S.shared.hands, {}) };
  host.bots.clear();
  for (const b of parse(S.shared.bots, [])) host.bots.set(b.i, newBot(b.i, b.n, b.c, b.r, b.x, b.z, host.bots.size));
  if (!host.g || host.land.length !== MW * MD) newLeg(1, 0);
  host.dirtyG = true;
}
const posOf = (id) => { if (id === net.sessionId) return me; const b = host.bots.get(id); if (b) return b; return parse(S.entities.players[id]?.p, null); };
const near = (p, x, z, d) => !!p && Math.hypot(p.x - x, p.z - z) <= d;
const setHand = (id, k, n) => { if (k && n > 0) host.hands[id] = [k, n]; else delete host.hands[id]; host.dirtyH = true; };

/** One intent from a crew member (a player, a bot or the host itself). */
function applyIntent(type, m, from) {
  const g = host.g, t = Date.now();
  if (type === "again") { if (g.phase === "over") newLeg(1, 0); return; }
  if (g.phase !== "run" && g.phase !== "ready") return;

  if (!said || (who && Math.hypot(said.x - who.x, said.z - who.z) > 2.5)) return; // the message's spot must roughly match where they are
  const h = { k: "", n: 0, ...(host.hands[from] ? { k: host.hands[from][0], n: host.hands[from][1] } : {}) };
  const x = m.x | 0, z = m.z | 0, ch = tileOf(host.land, x, z), reachTile = near(said, x + 0.5, z + 0.5, CONFIG.reach + 0.7);
  if (type === "hit") {
    if ((ch !== "T" && ch !== "R") || !reachTile) return;
    const k = idx(x, z), hp = (host.hp.get(k) ?? CONFIG.hits[ch]) - 1;
    fx({ kind: ch === "T" ? "chop" : "mine", x: x + 0.5, z: z + 0.5 });
    if (hp > 0) { host.hp.set(k, hp); return; }
    host.hp.delete(k); host.land = host.land.slice(0, k) + "." + host.land.slice(k + 1); host.dirtyL = true;
    const kind = KIND_OF[ch];
    if (!h.k || (h.k === kind && h.n < CONFIG.carry)) setHand(from, kind, h.n + 1);
  } else if (type === "water") {
    if (ch !== "W" || !reachTile || h.k) return;
    setHand(from, "water", 1); fx({ kind: "splash", x: x + 0.5, z: z + 0.5 });
  } else if (type === "deposit") {
    const c = wagonAt(g, 1, t);
    if ((h.k !== "wood" && h.k !== "stone") || !near(said, c.x, c.z, 2.4)) return;
    g[h.k] += h.n; setHand(from, "", 0); fx({ kind: "deposit", x: c.x, z: c.z });
  } else if (type === "cool") {
    const e = wagonAt(g, 0, t);
    if (h.k !== "water" || !near(said, e.x, e.z, 2.4)) return;
    g.heat0 = 0; g.heatAt = Math.max(t, g.heatAt); setHand(from, "", 0); fx({ kind: "cool", x: e.x, z: e.z });
  } else if (type === "take") {
    const w = wagonAt(g, 2, t);
    if (!g.stash || (h.k && h.k !== "track") || h.n >= CONFIG.carry || !near(said, w.x, w.z, 2.4)) return;
    const n = Math.min(CONFIG.carry - h.n, g.stash); g.stash -= n; setHand(from, "track", h.n + n);
  } else if (type === "lay") {

  const L = land(), t = Date.now();
  buildLand(L, g); buildTrack(g);
  // the train
  const heat = heatOf(g, t), over = g.phase === "over";
  trainParts.forEach((w, k) => {
    const p = wagonAt(g, k, t), d = trainDist(g, t) - k * WAGON_GAP, tiles = trackTiles(g).tiles, off = d > tiles.length - 1 ? d - (tiles.length - 1) : 0;
    w.g.position.set(p.x, 0.02, p.z); w.g.rotation.y = -p.a;
    w.inner.rotation.x = over && g.why === "derail" ? Math.min(1.2, off * 2) : 0; w.inner.position.y = g.phase === "run" ? Math.abs(Math.sin(now / 120 + k)) * 0.02 : 0;
  });
  heatGlow.material.opacity = heat > 40 ? ((heat - 40) / 60) * (0.5 + 0.3 * Math.sin(now / 90)) : 0;
  if (g.phase === "run" && Math.random() < 0.25) { const e = wagonAt(g, 0, t); burst(e.x + Math.cos(e.a) * 0.36, 1.5, e.z + Math.sin(e.a) * 0.36, heat > 70 ? "#555" : "#f4f4f4", 1, 0.3, 0.22, 1.2, -0.6); }
  if (over && g.why === "heat" && Math.random() < 0.5) { const e = wagonAt(g, 0, t); burst(e.x, 1.2, e.z, Math.random() < 0.5 ? "#ff7a1a" : "#333", 2, 1.5, 0.25, 1, -1); }
  cargo.wood.forEach((m, i) => (m.visible = i < g.wood)); cargo.stone.forEach((m, i) => (m.visible = i < g.stone)); cargo.track.forEach((m, i) => (m.visible = i < g.stash));
  gear.rotation.z = g.craftAt ? now / 150 : 0; gear.visible = !!g.craftAt;
  // where my next piece of track would go
  const u = !ATTRACT && useHere(g);
  ghost.visible = !!(u && u.spot); if (ghost.visible) { ghost.position.set(u.spot.x + 0.5, 0.06, u.spot.z + 0.5); ghost.material.opacity = 0.4 + Math.sin(now / 150) * 0.2; }
  // the crew: me, the other players (eased), the bots
  const seen = new Set(), live = new Set(livePlayers());
  const show = (id, color, name, x, z, f, a, moving) => { let p = crew.get(id); if (!p) { p = makePerson(color, name); crew.set(id, p); } seen.add(id); placePerson(p, x, z, f, a, moving, id === net.sessionId ? 1 : dt, now); showLoad(p, handOf(id)); };
  show(net.sessionId, myColor, "", me.x, me.z, me.f, me.a > 0, me.moving);
  for (const [id, p] of Object.entries(S.entities.players || {})) { if (id === net.sessionId || !live.has(id)) continue; const q = parse(p.p, null); if (q) { const c = crew.get(id); show(id, p.c || "#ccc", p.n || "Player", q.x, q.z, q.f, !!q.a, !!c && Math.hypot(q.x - c.x, q.z - c.z) > 0.05); } }
  for (const b of botList()) { const c = crew.get(b.i); show(b.i, b.c, ATTRACT ? "" : b.n, b.x, b.z, b.f, !!b.a, !!c && Math.hypot(b.x - c.x, b.z - c.z) > 0.04); }
  for (const [id, p] of crew) if (!seen.has(id)) { scene.remove(p.g); crew.delete(id); }
}
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the train meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  readKeys();
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const g = game();
  if (g && land().length === MW * MD) {
    myTick(dt, g, realNow);
    drawWorld(g, dt, now);
    if (now - lastHud > 120) { lastHud = now; hud(g); }
  }
  placeCamera(g, dt, now);
  partsTick(dt);
  renderer.render(scene, camera);
}

(async function start() {
  document.body.classList.toggle("attract", ATTRACT);
  if (ATTRACT) CONFIG.seats = 3;
  net = await connect();
  net.onState((st) => { S = st; });
  for (const type of ["hit", "water", "deposit", "cool", "take", "lay", "again"]) net.on(type, (m, from) => { if (isHost()) applyIntent(type, m || {}, from); });
  net.on("fx", (m) => showFx(m));
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") boardApi = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  $("hint").textContent = touchUI ? "Drag to walk, hold USE to chop trees and mine rocks. Load them into the green wagon, grab the track it makes and lay it ahead of the train. Water cools the engine!"
    : "WASD to walk, hold Space to chop trees and mine rocks. Load them into the green wagon, grab the track it makes and lay it ahead of the train. Water cools the engine!";
  hintUntil = performance.now() + 15000;
  if (QS.has("test")) window.__test = { game, land, hands, handOf, me, useHere, trainDist, heatOf, trackTiles, layable, host, isHost, act, input }; // for automated tests only
  requestAnimationFrame(frame);
})();
</script>
